<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>page-counter-website</title>
  </head>
  <body>
    <h1>Page counter (on the web!)</h1>
    <form>
        <label for="textfile-input" class="form-label">Input text file</label>
        <input type="file" id="textfile-input" accept="text/*" class="form-control" required/>
        
        <label for="font-size" class="form-label">Font size</label>
        <div class="input-group">
            <input type="number" id="font-size" min=1 value=12 class="form-control">
            <span class="input-group-text">pt</span>
        </div>

        <label for="line-spacing" class="form-label">Line spacing</label>
        <input type="number" id="line-spacing" min=0 value=1.12 step=0.01 class="form-control">

        <label for="page-height" class="form-label">Page height</label>
        <div class="input-group">
            <input type="number" id="page-height" min=0.1 step=0.1 value=11 class="form-control">
            <select class="input-group-text">
                <option selected value="in">in</option>
                <option value="cm">cm</option>
            </select>
        </div>

        <label for="page-width" class="form-label">Page width</label>
        <div class="input-group">
            <input type="number" id="page-width" min=0.1 step=0.1 value=8.5 class="form-control">
            <select class="input-group-text">
                <option selected value="in">in</option>
                <option value="cm">cm</option>
            </select>
        </div>

        <label for="margin-top" class="form-label">Margin top</label>
        <div class="input-group">
            <input type="number" id="margin-top" min=0 step=0.1 value=1 class="form-control">
            <select class="input-group-text">
                <option selected value="in">in</option>
                <option value="cm">cm</option>
            </select>
        </div>

        <label for="margin-bottom" class="form-label">Margin bottom</label>
        <div class="input-group">
            <input type="number" id="margin-bottom" min=0 step=0.1 value=1 class="form-control">
            <select class="input-group-text">
                <option selected value="in">in</option>
                <option value="cm">cm</option>
            </select>
        </div>

        <label for="margin-left" class="form-label">Margin right</label>
        <div class="input-group">
            <input type="number" id="margin-left" min=0 step=0.1 value=1 class="form-control">
            <select class="input-group-text">
                <option selected value="in">in</option>
                <option value="cm">cm</option>
            </select>
        </div>

        <label for="margin-right" class="form-label">Margin right</label>
        <div class="input-group">
            <input type="number" id="margin-right" min=0 step=0.1 value=1 class="form-control">
            <select class="input-group-text">
                <option selected value="in">in</option>
                <option value="cm">cm</option>
            </select>
        </div>

        <label for="paragraph-spacing-before" class="form-label">Paragraph spacing before</label>
        <div class="input-group">
            <input type="number" id="paragraph-spacing-before" min=0 step=0.1 value=0 class="form-control">
            <select class="input-group-text">
                <option selected value="in">in</option>
                <option value="cm">cm</option>
            </select>
        </div>

        <label for="paragraph-spacing-after" class="form-label">Paragraph spacing after</label>
        <div class="input-group">
            <input type="number" id="paragraph-spacing-after" min=0 step=0.01 value=0.14 class="form-control">
            <select class="input-group-text">
                <option selected value="in">in</option>
                <option value="cm">cm</option>
            </select>
        </div>
        
        <label for="header-from-top" class="form-label">Header from top</label>
        <div class="input-group">
            <input type="number" id="header-from-top" min=0 step=0.01 value=0.5 class="form-control">
            <select class="input-group-text">
                <option selected value="in">in</option>
                <option value="cm">cm</option>
            </select>
        </div>

        <label for="footer-from-bottom" class="form-label">Footer from bottom</label>
        <div class="input-group">
            <input type="number" id="footer-from-bottom" min=0 step=0.01 value=0.5 class="form-control">
            <select class="input-group-text">
                <option selected value="in">in</option>
                <option value="cm">cm</option>
            </select>
        </div>

        <button type="submit" id="form-submit-btn" class="btn btn-primary">Submit</button>
    </form>

    <h2 id="pagecount-result" hidden>Result is:</h2>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
